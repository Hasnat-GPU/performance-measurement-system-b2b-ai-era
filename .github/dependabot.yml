version: 2

updates:
  # The only dependencies this repository has are the GitHub Actions its
  # workflows consume. Because those are pinned to commit SHAs, Dependabot
  # is what keeps them from silently going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: scope
    labels:
      - dependencies
      - maintenance
    groups:
      actions:
        patterns:
          - '*'
